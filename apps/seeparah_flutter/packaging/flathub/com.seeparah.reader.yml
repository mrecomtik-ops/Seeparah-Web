# Flathub manifest — BLOCKED until a public GitHub Release contains the
# Linux x64 bundle tarball. Replace RELEASE_URL and SHA256 with real values
# from that release, then open the submission PR against flathub/flathub.
app-id: com.seeparah.reader
runtime: org.gnome.Platform
runtime-version: "48"
sdk: org.gnome.Sdk
command: seeparah
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
modules:
  - name: seeparah
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/seeparah /app/bin
      - cp -r bundle/* /app/lib/seeparah/
      - ln -s /app/lib/seeparah/seeparah_reader /app/bin/seeparah
      - install -Dm644 com.seeparah.reader.desktop /app/share/applications/com.seeparah.reader.desktop
      - install -Dm644 com.seeparah.reader.metainfo.xml /app/share/metainfo/com.seeparah.reader.metainfo.xml
      - install -Dm644 seeparah.png /app/share/icons/hicolor/512x512/apps/com.seeparah.reader.png
    sources:
      - type: archive
        url: RELEASE_URL/seeparah-linux-x64-1.0.0.tar.gz
        sha256: SHA256
        dest: bundle
      - type: file
        path: ../linux/com.seeparah.reader.metainfo.xml
      - type: file
        path: ../linux/com.seeparah.reader.desktop
      - type: file
        path: seeparah.png
