# Flathub manifest for Seeparah 1.0.0.
# Repackages the tested Linux .deb from the v1.0.0 GitHub release (built by
# desktop-production-release.yml run 44893468827). The URL only resolves after
# the owner publishes the draft release; the SHA-256 is from that run's log.
app-id: com.seeparah.reader
runtime: org.gnome.Platform
runtime-version: "48"
sdk: org.gnome.Sdk
command: seeparah
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
modules:
  - name: seeparah
    buildsystem: simple
    build-commands:
      - ar x Seeparah-1.0.0-Linux-amd64.deb
      - mkdir -p deb && tar -xf data.tar.* -C deb
      - test -x deb/usr/lib/seeparah/seeparah_reader
      - mkdir -p /app/lib /app/bin
      - cp -a deb/usr/lib/seeparah /app/lib/seeparah
      - ln -s /app/lib/seeparah/seeparah_reader /app/bin/seeparah
      - install -Dm644 com.seeparah.reader.desktop /app/share/applications/com.seeparah.reader.desktop
      - install -Dm644 com.seeparah.reader.metainfo.xml /app/share/metainfo/com.seeparah.reader.metainfo.xml
      - install -Dm644 deb/usr/share/icons/hicolor/256x256/apps/seeparah.png /app/share/icons/hicolor/256x256/apps/com.seeparah.reader.png
    sources:
      - type: file
        url: https://github.com/mrecomtik-ops/Seeparah-Web/releases/download/v1.0.0/Seeparah-1.0.0-Linux-amd64.deb
        sha256: 5f92ed7abec6709ea2a37652d5776dd745680bc745b10be54c23ca22a64e735b
        only-arches: [x86_64]
      - type: file
        path: ../linux/com.seeparah.reader.metainfo.xml
      - type: file
        path: ../linux/com.seeparah.reader.desktop
