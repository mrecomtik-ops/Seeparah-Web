name: Seeparah Android and iOS simulator offline tests

on:
  pull_request:
    paths:
      - 'apps/seeparah_flutter/**'
      - '.github/workflows/native-device-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seeparah-native-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-emulator:
    name: Android emulator offline reader
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Generate Android runner and icons
        working-directory: apps/seeparah_flutter
        run: |
          set -euo pipefail
          python -m pip install --user pillow==11.3.0
          python tool/generate_icons.py
          flutter create --platforms=android --org com.seeparah --project-name seeparah_reader .
          python tool/configure_platforms.py
          flutter pub get
          dart run flutter_launcher_icons
      - name: Enable KVM virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run native offline reading on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: cd apps/seeparah_flutter && flutter test integration_test/offline_device_test.dart -d emulator-5554 -r expanded

  ios-simulator:
    name: iPhone simulator offline reader
    runs-on: macos-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Prepare iOS simulator app
        working-directory: apps/seeparah_flutter
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/seeparah-icons"
          "$RUNNER_TEMP/seeparah-icons/bin/python" -m pip install pillow==11.3.0
          "$RUNNER_TEMP/seeparah-icons/bin/python" tool/generate_icons.py
          flutter create --platforms=ios --org com.seeparah --project-name seeparah_reader .
          python3 tool/configure_platforms.py
          flutter pub get
          dart run flutter_launcher_icons
      - name: Boot available iPhone Simulator and run offline tests
        working-directory: apps/seeparah_flutter
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$RUNNER_TEMP/simulators.json"
          UDID="$(python3 - "$RUNNER_TEMP/simulators.json" <<'PY'
          import json,sys
          with open(sys.argv[1]) as fh:
              all_devices=json.load(fh).get('devices',{})
          ios=[d for runtime,devices in all_devices.items() if 'iOS' in runtime
               for d in devices if d.get('isAvailable',True) and 'iPhone' in d.get('name','')]
          print(ios[0]['udid'] if ios else '')
          PY
          )"
          if [ -z "$UDID" ]; then
            echo 'No iOS iPhone simulator runtime is installed on runner' >&2
            exit 1
          fi
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          flutter devices
          flutter test integration_test/offline_device_test.dart -d "$UDID" -r expanded
