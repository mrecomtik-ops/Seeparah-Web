name: Seeparah isolated admin and shelf browser acceptance
on:
  pull_request:
    paths:
      - "scripts/qa/admin-browser-acceptance.mjs"
      - "scripts/qa/browser-fixtures/**"
      - ".github/workflows/admin-browser-acceptance.yml"
      - "src/components/admin/AdminBookHeaderActions.tsx"
      - "src/components/admin/AdminBookDestructiveDialogs.tsx"
      - "src/components/admin/AdminBookMetadataDialog.tsx"
      - "src/components/ShelfButtons.tsx"
      - "src/lib/shelves.ts"
      - "src/lib/admin/cover-crop.ts"
      - "src/lib/admin/staged-cover.ts"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-interaction-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Real Chromium/WebKit interactions with synthetic identities (never production writes)
        run: node scripts/qa/admin-browser-acceptance.mjs
