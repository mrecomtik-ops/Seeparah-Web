name: Seeparah 44-book structure regression — production

on:
  pull_request:
    paths:
      - "scripts/qa/public-reader-structure-regression.mjs"
      - "scripts/qa/fixtures/false-part-reader-44.json"
      - ".github/workflows/public-reader-structure-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-production-navigation:
    name: "Reader TOC shard ${{ matrix.shard }} (desktop + mobile)"
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Compare live source-backed TOC with exact repaired edition
        run: node scripts/qa/public-reader-structure-regression.mjs
        env:
          SEEPARAH_QA_URL: https://seeparah.com
          QA_SHARD_INDEX: ${{ matrix.shard }}
          QA_SHARD_COUNT: "4"
          QA_DIAGNOSTIC: "1"
