name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Build first: TanStack Start generates route-tree types for new routes.
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm test

  dependency-security:
    name: Dependency security (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Record production dependency exposure separately
        run: |
          # Advisory reports include both app-runtime and build-tool packages.
          # This step only records the production-only result. The full
          # unfiltered audit below is the release-blocking security gate.
          npm audit --omit=dev --json > npm-production-audit.json || true
          node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('npm-production-audit.json', 'utf8'));
          if (!data.metadata?.vulnerabilities) throw new Error('Production dependency audit did not return valid metadata');
          console.log('Production-dependency advisory counts:', JSON.stringify(data.metadata.vulnerabilities));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: seeparah-production-dependency-audit
          path: npm-production-audit.json
          retention-days: 7
          if-no-files-found: error
      # Keep the real security failure visible; do NOT suppress advisories.
      # A new unpatched upstream advisory must not prevent functional tests
      # from running, but must still fail the overall workflow.
      - run: npm audit --audit-level=high
