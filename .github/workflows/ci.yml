name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      # Build first: TanStack Start generates src/routeTree.gen.ts for new routes.
      # Typechecking before route generation reports false navigation errors.
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm test
