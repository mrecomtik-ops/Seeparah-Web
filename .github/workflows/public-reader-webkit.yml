name: Public multilingual reader WebKit QA
on:
  pull_request:
    paths:
      - "scripts/qa/public-reader-webkit.mjs"
      - ".github/workflows/public-reader-webkit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  webkit-script-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps webkit
      - run: node scripts/qa/public-reader-webkit.mjs
        env:
          SEE_PARAH_QA_URL: https://seeparah.com
