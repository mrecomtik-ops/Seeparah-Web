name: Seeparah Microsoft Store MSIX package
# Builds an UNSIGNED Store MSIX. Microsoft re-signs Store submissions for free,
# so this path needs no paid code-signing certificate. The package is uploaded
# to Partner Center by the owner; this workflow never submits or publishes.
#
# Identity values are public and come from Partner Center > Seeparah (Store ID
# 9NWM8PBXLZ46) > Product identity. PR builds are QA only; upload only an
# artifact from a manual run on main after device QA.
on:
  pull_request:
    paths:
      - "apps/seeparah_flutter/**"
      - ".github/workflows/microsoft-store-msix.yml"
  workflow_dispatch:
    inputs:
      identity_name:
        description: "Package/Identity/Name from Partner Center"
        required: true
        default: "Seeparah.Seeparah"
      publisher:
        description: "Package/Identity/Publisher from Partner Center"
        required: true
        default: "CN=D42BED1A-28F5-49EA-A73D-85C8F53BA774"
      publisher_display_name:
        description: "Package/Properties/PublisherDisplayName from Partner Center"
        required: true
        default: "Seeparah"
      store_version:
        description: "Store package version (last part must be 0, e.g. 1.0.0.0)"
        required: true
        default: "1.0.0.0"

permissions:
  contents: read

jobs:
  msix:
    name: Store MSIX
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true
      - name: Build Windows app
        shell: pwsh
        working-directory: apps/seeparah_flutter
        run: |
          python -m pip install --user pillow==11.3.0
          python tool/generate_icons.py
          flutter create --platforms=windows --org com.seeparah --project-name seeparah_reader .
          python tool/configure_platforms.py
          flutter pub get
          dart run flutter_launcher_icons
          flutter build windows --release --dart-define=SEEPARAH_API_ORIGIN=https://seeparah.com
          if ($LASTEXITCODE -ne 0) { throw "Flutter Windows build failed" }
      - name: Package Store MSIX (unsigned; Microsoft signs on ingestion)
        shell: pwsh
        working-directory: apps/seeparah_flutter
        env:
          IDENTITY_NAME: ${{ inputs.identity_name || 'Seeparah.Seeparah' }}
          PUBLISHER: ${{ inputs.publisher || 'CN=D42BED1A-28F5-49EA-A73D-85C8F53BA774' }}
          PUBLISHER_DISPLAY_NAME: ${{ inputs.publisher_display_name || 'Seeparah' }}
          STORE_VERSION: ${{ inputs.store_version || '1.0.0.0' }}
        run: |
          if ($env:STORE_VERSION -notmatch '^\d+\.\d+\.\d+\.0$') { throw "Store version must look like 1.2.3.0" }
          dart run msix:create --store --build-windows false `
            --display-name "Seeparah" `
            --publisher-display-name "$env:PUBLISHER_DISPLAY_NAME" `
            --identity-name "$env:IDENTITY_NAME" `
            --publisher "$env:PUBLISHER" `
            --version "$env:STORE_VERSION" `
            --logo-path "assets/brand/app_icon_1024.png" `
            --capabilities "internetClient" `
            --languages "en-us"
          if ($LASTEXITCODE -ne 0) { throw "MSIX packaging failed" }
          $pkg = Get-ChildItem build/windows/x64/runner/Release -Filter *.msix | Select-Object -First 1
          if (-not $pkg) { throw "No .msix produced" }
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item $pkg.FullName "out/Seeparah_$($env:STORE_VERSION)_x64.msix"
          (Get-FileHash "out/Seeparah_$($env:STORE_VERSION)_x64.msix" -Algorithm SHA256).Hash | Out-File out/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: seeparah-store-msix${{ github.event_name == 'pull_request' && '-pr-qa' || '' }}
          path: apps/seeparah_flutter/out/
          retention-days: 30
