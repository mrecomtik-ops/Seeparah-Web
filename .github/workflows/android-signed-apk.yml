name: Seeparah signed Android APK (Huawei / Uptodown / GitHub Releases)
# Manually triggered. Builds a release-signed universal APK for stores that
# accept APKs. Uses the same owner-managed keystore secrets as the Play
# workflow but needs NO Google Play service account. Artifact only: nothing
# is uploaded to any store or published from here.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Android versionCode (integer, must increase every release)"
        required: true
      version_name:
        description: "Version name, e.g. 1.0.0"
        required: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    environment: seeparah-store-internal
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/seeparah_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true
      - name: Validate inputs and secrets
        env:
          SEEPARAH_ANDROID_KEYSTORE_B64: ${{ secrets.SEEPARAH_ANDROID_KEYSTORE_B64 }}
          SEEPARAH_ANDROID_STORE_PASSWORD: ${{ secrets.SEEPARAH_ANDROID_STORE_PASSWORD }}
          SEEPARAH_ANDROID_KEY_ALIAS: ${{ secrets.SEEPARAH_ANDROID_KEY_ALIAS }}
          SEEPARAH_ANDROID_KEY_PASSWORD: ${{ secrets.SEEPARAH_ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          for key in SEEPARAH_ANDROID_KEYSTORE_B64 SEEPARAH_ANDROID_STORE_PASSWORD SEEPARAH_ANDROID_KEY_ALIAS SEEPARAH_ANDROID_KEY_PASSWORD; do
            if [[ -z "${!key:-}" ]]; then echo "Missing required signing secret: ${key}" >&2; exit 1; fi
          done
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]{0,8}$ ]] || { echo "Invalid numeric version code"; exit 1; }
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version name"; exit 1; }
      - name: Generate Android runner and test
        run: |
          python -m pip install --user pillow==11.3.0
          python tool/generate_icons.py
          flutter create --platforms=android --org com.seeparah --project-name seeparah_reader .
          python tool/configure_platforms.py
          flutter pub get
          python -m unittest discover -s tool -p 'test_*.py'
          dart run flutter_launcher_icons
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Configure release signing
        env:
          SEEPARAH_ANDROID_KEYSTORE_B64: ${{ secrets.SEEPARAH_ANDROID_KEYSTORE_B64 }}
          SEEPARAH_ANDROID_STORE_PASSWORD: ${{ secrets.SEEPARAH_ANDROID_STORE_PASSWORD }}
          SEEPARAH_ANDROID_KEY_ALIAS: ${{ secrets.SEEPARAH_ANDROID_KEY_ALIAS }}
          SEEPARAH_ANDROID_KEY_PASSWORD: ${{ secrets.SEEPARAH_ANDROID_KEY_PASSWORD }}
          SEEPARAH_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/seeparah-upload.jks
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$SEEPARAH_ANDROID_KEYSTORE_B64" | base64 --decode > "$SEEPARAH_ANDROID_KEYSTORE_PATH"
          python tool/configure_release_signing.py
      - name: Build signed release APK
        env:
          SEEPARAH_ANDROID_STORE_PASSWORD: ${{ secrets.SEEPARAH_ANDROID_STORE_PASSWORD }}
          SEEPARAH_ANDROID_KEY_ALIAS: ${{ secrets.SEEPARAH_ANDROID_KEY_ALIAS }}
          SEEPARAH_ANDROID_KEY_PASSWORD: ${{ secrets.SEEPARAH_ANDROID_KEY_PASSWORD }}
          SEEPARAH_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/seeparah-upload.jks
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          flutter build apk --release \
            --build-name="$VERSION_NAME" --build-number="$VERSION_CODE" \
            --dart-define=SEEPARAH_API_ORIGIN=https://seeparah.com
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK" | tee signing.txt
          if grep -q "CN=Android Debug" signing.txt; then echo "Refusing debug-signed APK" >&2; exit 1; fi
          mkdir -p out
          cp "$APK" "out/Seeparah-$VERSION_NAME-android.apk"
          (cd out && sha256sum *.apk > SHA256SUMS.txt)
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/seeparah-upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: seeparah-android-signed-apk-${{ inputs.version_name }}
          path: apps/seeparah_flutter/out/
          retention-days: 30
