name: Sacred Live Verify Temp

on:
  push:
    branches:
      - sacred-live-verify-2026-10-13b

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Chrome
        run: google-chrome --version

      - name: Verify rendered sacred pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/seeparah
          dump() {
            local name="$1"
            local url="$2"
            timeout 45s google-chrome               --headless=new               --no-sandbox               --disable-gpu               --disable-dev-shm-usage               --virtual-time-budget=12000               --dump-dom "$url" > "/tmp/seeparah/$name.html"
          }

          dump collection "https://seeparah.com/sacred-texts"
          detail_count="$(grep -oE '/sacred-texts/[0-9a-f-]{36}' /tmp/seeparah/collection.html | sort -u | wc -l | tr -d ' ')"
          test "$detail_count" = "68"
          grep -Fq "book-covers/sacred/quran.webp" /tmp/seeparah/collection.html
          grep -Fq "book-covers/sacred/tanakh-jps-1917.webp" /tmp/seeparah/collection.html
          grep -Fq "book-covers/sacred/sbl-greek-new-testament.webp" /tmp/seeparah/collection.html
          grep -Fq "Dhammapada" /tmp/seeparah/collection.html
          echo "collection: PASS ($detail_count sacred detail links)"

          dump quran-detail "https://seeparah.com/sacred-texts/f7e3a9f0-931a-5207-9859-a27210cc2ca8"
          grep -Fq "Muhammad Ibrahim Junagarhi" /tmp/seeparah/quran-detail.html
          grep -Fq "Rowwad Translation Center" /tmp/seeparah/quran-detail.html
          grep -Fq "Mufti Taqi Usmani Urdu is not included" /tmp/seeparah/quran-detail.html
          grep -Fq "book-covers/sacred/quran.webp" /tmp/seeparah/quran-detail.html
          echo "quran detail: PASS"

          dump quran-urdu "https://seeparah.com/read/f7e3a9f0-931a-5207-9859-a27210cc2ca8?lang=Urdu&page=262"
          grep -Fq 'id="sacred-chunk-261"' /tmp/seeparah/quran-urdu.html
          grep -Fq "اللہ تعالیٰ ہی معبود" /tmp/seeparah/quran-urdu.html
          ! grep -Fq "Request translation" /tmp/seeparah/quran-urdu.html
          echo "quran urdu 2:255: PASS"

          dump quran-arabic "https://seeparah.com/read/f7e3a9f0-931a-5207-9859-a27210cc2ca8?lang=Arabic&page=262"
          grep -Fq 'id="sacred-chunk-261"' /tmp/seeparah/quran-arabic.html
          grep -Fq "ٱللَّهُ لَآ إِلَـٰهَ" /tmp/seeparah/quran-arabic.html
          echo "quran arabic 2:255: PASS"

          dump genesis "https://seeparah.com/read/87205571-41a9-540a-abd2-3784a4079fad?lang=Hebrew&page=1"
          grep -Fq 'id="sacred-chunk-0"' /tmp/seeparah/genesis.html
          grep -Fq "בְּרֵאשִׁ֖ית בָּרָ֣א" /tmp/seeparah/genesis.html
          echo "genesis hebrew: PASS"

          dump matthew "https://seeparah.com/read/7bc812fd-6a4d-544e-903f-b2e333a5cc4f?lang=Greek&page=1"
          grep -Fq 'id="sacred-chunk-0"' /tmp/seeparah/matthew.html
          grep -Fq "Βίβλος γενέσεως Ἰησοῦ" /tmp/seeparah/matthew.html
          echo "matthew greek: PASS"

          dump dhammapada "https://seeparah.com/read/3e2c1103-36a9-5a44-987c-259d27dea072?lang=Pali&page=1"
          grep -Fq 'id="sacred-chunk-0"' /tmp/seeparah/dhammapada.html
          grep -Fq "Manopubbaṅgamā dhammā" /tmp/seeparah/dhammapada.html
          echo "dhammapada pali: PASS"

          dump quran-late "https://seeparah.com/read/f7e3a9f0-931a-5207-9859-a27210cc2ca8?lang=Urdu&page=6236"
          grep -Fq 'id="sacred-chunk-6235"' /tmp/seeparah/quran-late.html
          grep -Fq "وه جن میں سے ہو یا انسان میں سے" /tmp/seeparah/quran-late.html
          ! grep -Fq "Request translation" /tmp/seeparah/quran-late.html
          echo "quran urdu 114:6: PASS"
