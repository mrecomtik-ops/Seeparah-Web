name: Controlled dependency audit remediation (branch only)

on:
  push:
    branches: [security/dependency-refresh-20261030]

permissions:
  contents: write

jobs:
  resolve-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned baseline
        run: npm ci
      - name: Generate lockfile security remediation
        run: |
          # The first audit pass updates the primary dependencies, but npm may
          # leave a second pass of Cloudflare tooling and Happy DOM advisories.
          npm audit fix --force || true
          npm install --save-dev --save-exact happy-dom@21.0.4 wrangler@4.156.0
          npm audit fix --force || true
      - name: Confirm no high advisories
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Regression tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit only verified dependency metadata on isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then echo 'No package changes'; exit 0; fi
          git commit -m 'Update audited dependencies after typecheck and reader tests'
          gh auth setup-git
          git push origin HEAD:security/dependency-refresh-20261030
