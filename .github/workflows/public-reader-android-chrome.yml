name: Public reader native Android Chrome emulator QA
on:
  pull_request:
    paths:
      - "scripts/qa/public-reader-android-chrome.mjs"
      - ".github/workflows/public-reader-android-chrome.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright protocol client (no desktop browser)
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
      - name: Allow Android Emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test native Android Chrome, published multilingual sources and RTL
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: node scripts/qa/public-reader-android-chrome.mjs
        env:
          SEE_PARAH_QA_URL: https://seeparah.com
