name: Seeparah Android Play Store internal release
# First publish a *signed* AAB to an internal test track. Promote to production
# in Play Console only after physical-device QA, rights checks and approval.
# Never use the existing debug APK as a store release.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name, e.g. 1.0.0"
        required: true
        default: "1.0.0"
        type: string
      version_code:
        description: "Increasing Play Store versionCode, e.g. 1"
        required: true
        default: "1"
        type: string
permissions:
  contents: read

jobs:
  internal:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: seeparah-store-internal
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
        working-directory: apps/seeparah_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Check required signing and Play credentials
        env:
          SEEPARAH_ANDROID_KEYSTORE_B64: ${{ secrets.SEEPARAH_ANDROID_KEYSTORE_B64 }}
          SEEPARAH_ANDROID_STORE_PASSWORD: ${{ secrets.SEEPARAH_ANDROID_STORE_PASSWORD }}
          SEEPARAH_ANDROID_KEY_ALIAS: ${{ secrets.SEEPARAH_ANDROID_KEY_ALIAS }}
          SEEPARAH_ANDROID_KEY_PASSWORD: ${{ secrets.SEEPARAH_ANDROID_KEY_PASSWORD }}
          SEEPARAH_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.SEEPARAH_PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          for key in SEEPARAH_ANDROID_KEYSTORE_B64 SEEPARAH_ANDROID_STORE_PASSWORD SEEPARAH_ANDROID_KEY_ALIAS SEEPARAH_ANDROID_KEY_PASSWORD SEEPARAH_PLAY_SERVICE_ACCOUNT_JSON; do
            if [[ -z "${!key:-}" ]]; then echo "Missing required store secret: ${key}" >&2; exit 1; fi
          done
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]{0,8}$ ]] || { echo "Invalid numeric version code"; exit 1; }
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version name"; exit 1; }
      - name: Generate native platform runner
        run: |
          python -m pip install --user pillow==11.3.0
          python tool/generate_icons.py
          flutter create --platforms=android,ios,macos,windows,linux --org com.seeparah --project-name seeparah_reader .
          python tool/configure_platforms.py
          flutter pub get
          dart run flutter_launcher_icons
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Configure upload-key signing
        env:
          SEEPARAH_ANDROID_KEYSTORE_B64: ${{ secrets.SEEPARAH_ANDROID_KEYSTORE_B64 }}
          SEEPARAH_ANDROID_STORE_PASSWORD: ${{ secrets.SEEPARAH_ANDROID_STORE_PASSWORD }}
          SEEPARAH_ANDROID_KEY_ALIAS: ${{ secrets.SEEPARAH_ANDROID_KEY_ALIAS }}
          SEEPARAH_ANDROID_KEY_PASSWORD: ${{ secrets.SEEPARAH_ANDROID_KEY_PASSWORD }}
          SEEPARAH_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/seeparah-upload.jks
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$SEEPARAH_ANDROID_KEYSTORE_B64" | base64 --decode > "$SEEPARAH_ANDROID_KEYSTORE_PATH"
          python tool/configure_release_signing.py
      - name: Build signed Google Play app bundle
        env:
          SEEPARAH_ANDROID_STORE_PASSWORD: ${{ secrets.SEEPARAH_ANDROID_STORE_PASSWORD }}
          SEEPARAH_ANDROID_KEY_ALIAS: ${{ secrets.SEEPARAH_ANDROID_KEY_ALIAS }}
          SEEPARAH_ANDROID_KEY_PASSWORD: ${{ secrets.SEEPARAH_ANDROID_KEY_PASSWORD }}
          SEEPARAH_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/seeparah-upload.jks
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          flutter build appbundle --release \
            --build-name="$VERSION_NAME" --build-number="$VERSION_CODE" \
            --dart-define=SEEPARAH_API_ORIGIN=https://seeparah.com
          test -s build/app/outputs/bundle/release/app-release.aab
          sha256sum build/app/outputs/bundle/release/app-release.aab
      - name: Upload AAB to internal Play testing track
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.SEEPARAH_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.seeparah.reader
          releaseFiles: apps/seeparah_flutter/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
      - name: Remove temporary upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/seeparah-upload.jks"
